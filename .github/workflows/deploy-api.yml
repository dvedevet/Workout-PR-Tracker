
name: Build and deploy ASP.Net Core app to Azure Web App - workout-pr-api-tugay

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build backend --configuration Release

      - name: Publish with dotnet
        run: dotnet publish backend -c Release -o "${{ runner.temp }}/myapp"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./published-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_86502E3D0E6245138A67C76C439F9643 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4DA9B74B533F4038A5123A3B3EF22524 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_22E33766396147B091339EE64CBC1788 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: workout-pr-api-tugay
          slot-name: Production
          package: ./published-app
